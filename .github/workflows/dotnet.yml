name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Versão que você está usando

    - name: Restore dependencies
      run: dotnet restore src/SuperTodo.API/SuperTodo.API.csproj

    - name: Build
      run: dotnet build --no-restore src/SuperTodo.API/SuperTodo.API.csproj

    - name: Test
      run: dotnet test --no-build tests/SuperTodo.UnitTests/SuperTodo.UnitTests.csproj
